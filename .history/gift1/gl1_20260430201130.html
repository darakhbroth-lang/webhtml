<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dragon Card Carousel with UI</title>
    <link rel="stylesheet" href="gl1.css">
</head>
<body>
   
     
    <div class="banner">
    <!-- Background Grid/Pattern -->
     >
    <div class="grid"></div>

    <!-- The Large Background Text -->
    <div class="bg-text">CSS ONLY</div>
       
    <!-- The Central Subject (Cyborg/Robot) -->
    <div class="model">
       
    </div>

    <!-- The 3D Auto-Rotating Slider -->
    <div class="slider" style="--quantity: 8;">
        <div class="item" style="--position: 1"><img src="/img1/image1.jpg" alt=""></div>
        <div class="item" style="--position: 2"><img src="/img1/image2.jpg" alt=""></div>
        <div class="item" style="--position: 3"><img src="/img1/imag3.jpeg" alt=""></div>
        <div class="item" style="--position: 4"><img src="/img1/image4.jpg" alt=""></div>
        <div class="item" style="--position: 5"><img src="/img1/image5.jpeg" alt=""></div>
        <div class="item" style="--position: 6"><img src="/img1/image6.jpeg" alt=""></div>
        <div class="item" style="--position: 7"><video src="/Vedio/IMG_6470.MP4"height=80%></video></div>
        <div class="item" style="--position: 8"><img src="/img1/image3.jpg" alt=""></div>
       
    </div>

    <!-- Sidebar Info -->
    <div class="content">
        <h1 class="author">LUNDEV</h1>
        <div class="model-info">
            <p>Web Design</p>
            <p>Subscribe to the channel to watch many interesting videos</p>
        </div>
    </div>
</div>

    <script src="gl1.js"></script>
</body>
</html>
