<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1 style="font-size:40px" align="center"><u>Table</u></h1>
    <table align="center" style="width:60%;font-size: 20px;" border="3">
        <tr >
            <th colspan="4">A</th>
        </tr>
        <tr>
            <th rowspan="2">A</th>
            <th>B</th>
            <th>C</th>
            <th rowspan="2">D</th>
        </tr>
        <tr align="center">
            <td >E</td>
            <td>F</td>
        </tr>
        <tr align="center">
            <td colspan="2">G</td>
           
            <td colspan="2">h</td>
        </tr>
        <tr align="center">
            <td rowspan="2" colspan="2">I</td>
            <td colspan="1">J</td>
            <td>k</td>
        </tr>
        <tr align="center">
            <td colspan="3">L</td>
           
           
        </tr>
    
</body>
</html>
