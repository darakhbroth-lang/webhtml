<!DOCTYPE html>
<html>
<head>
    <title>Personal Details Form</title>
    <style>
    </style>
</head>
<body>


    <form style="width: 400px; padding: 20px;">
        <fieldset>
            <legend>Personal Details</legend>
            
            <label style="display: inline-block; width: 100px; margin-bottom: 10px;">Salutation</label>
            <select>
                <option>--None--</option>
                <option>Mr.</option>
                <option>Ms.</option>
            </select>
            <br>

            <label style="display: inline-block; width: 100px; margin-bottom: 10px;">First name:</label>
            <input type="text">
            <br>

            <label style="display: inline-block; width: 100px; margin-bottom: 10px;">Last name:</label>
            <input type="text">
            <br>

            <label>Gender :</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <br><br>

            <label style="display: inline-block; width: 100px; margin-bottom: 10px;">Email:</label>
            <input type="email">
            <br>

            <label style="display: inline-block; width: 100px; margin-bottom: 10px;">Date of Birth:</label>
            <input type="date">
            <br><br>

            <label style="vertical-align: top;">Address :</label>
            <textarea rows="4" cols="30"></textarea>
            <br><br>

            <button type="submit">Submit</button>
        </fieldset>
    </form>

</body>
</html>
