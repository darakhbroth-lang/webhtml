<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" style="width:30vw; height: 60vh;border:3px solid black;margin:90px auto;padding:30px;border-radius: 20px;">
        <fieldset><legend style="font-size: 25px;">Personal Imformation</legend>
             <label for="text" style="font-size: 20px;">Full name</label><br>
             <input type="text" placeholder="name" style="Width: 90%;border-radius: 7px; height: 20px;margin-bottom: 20px;">
              <label for="email" style="font-size: 20px;">Email</label><br>
             <input type="email" placeholder="email" style="Width: 90%;border-radius: 7px; height: 20px;margin-bottom: 20px;">
             <label for="date">Date of birth</label><br> 
             <input type="date">
        </fieldset>
        <button style="width: 40%; padding:8px; border-radius: 7px;margin-top: 7px;margin-bottom: 7px;">submit</button><br>
         
    </form>
   
</body>
</html>
