
       <!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        .reg-box { 
            border: 1px solid #000; 
            width: 350px; 
            padding: 15px; 
            font-family: Arial, sans-serif;
        }
        .row { margin-bottom: 15px; }
        label { display: inline-block; width: 110px; }
    </style>
</head>
<body>

<div class="reg-box">
    <h3>Student registration Form</h3>
    <form>
        <div class="row">
            <label>Full Name:</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Email Address:</label>
            <input type="email">
        </div>

        <div class="row">
            <label>Password:</label>
            <input type="password">
        </div>

        <div class="row">
            <label>Date of Birth:</label>
            <input type="date">
        </div>

        <div class="row">
            <label>Gender:</label>
            <input type="radio" name="g"> Female
            <input type="radio" name="g"> Male
        </div>

        <div class="row">
            <label>Course</label>
            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>JS</option>
            </select>
        </div>

        <div class="row">
            <strong>Skills You Have:</strong><br>
            <input type="checkbox"> HTML<br>
            <input type="checkbox"> CSS<br>
            <input type="checkbox"> JAVASCRIPT
        </div>

        <div class="row">
            <strong>Additional Comments:</strong><br>
            <textarea placeholder="Enter your comments" rows="4" style="width: 90%;"></textarea>
        </div>

        <div class="row">
            <strong>Upload your file:</strong><br>
            <input type="file"><br>
            <button type="button" style="margin-top:5px;">Upload</button>
        </div>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
