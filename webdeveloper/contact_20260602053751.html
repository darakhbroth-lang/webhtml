<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bootstrap 5</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark-custom text-white min-vh-100 py-5">
     <nav class="navbar navbar-expand-lg shadow fixed-top bg-white">
        <div class="container">
            <a class="navbar-brand fw-bold" style="color: rgba(231, 73, 16, 0.916);" href="boot.html">FOODIE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="home">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-black active" aria-current="page" href="boot.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-black" href="#about">about</a>
                    </li><li class="nav-item">
                        <a class="nav-link text-black" href="contact.html">contact</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link text-black fw-bold dropdown-toggle" href="category.html">
                            Category
                        </a>
                    </li>
                </ul>
                
                <form class="d-flex align-items-center justify-content-center me-4 gap-3" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- Section Title -->
        <div class="row mb-5 text-center">
            <div class="col-12">
                <h2 class="fw-bold text-uppercase tracking-wider" style="color: black;">Get In Touch</h2>
                <p class="text-secondary">We would love to hear from you. Drop us a line below!</p>
            </div>
        </div>

        <div class="row g-5">
            
            <!-- LEFT COLUMN: Contact Form -->
            <div class="col-12 col-lg-6">
                <div class="p-4 rounded shadow-sm" style="background-color: #bbbfc1;">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Your Name</label>
                                <input type="text" class="form-control form-control-custom py-2" placeholder="Hok leng" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Email Address</label>
                                <input type="email" class="form-control form-control-custom py-2" placeholder="name@example.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small">Subject</label>
                                <input type="text" class="form-control form-control-custom py-2" placeholder="How can we help?">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small">Message</label>
                                <textarea class="form-control form-control-custom" rows="5" placeholder="Type your message here..." required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RIGHT COLUMN: Contact Info Block (Matches your screenshot) -->
            <div class="col-12 col-lg-6 d-flex flex-column justify-content-center border-start border-secondary border-opacity-25 ps-lg-5">
                
                <div class="d-flex flex-column gap-4">
                    
                    <!-- Phone Item -->
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-circle-custom rounded-circle d-flex align-items-center justify-content-center text-white">
                            <i class="bi bi-telephone-outbound fs-5"></i>
                        </div>
                        <div class="d-flex flex-column" >
                            <span class="text-label-custom text-lowercase">phone number</span>
                            <span style="color: black;">+(885) 15298572</span>
                        </div>
                    </div>

                    <!-- Email Item -->
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-circle-custom rounded-circle d-flex align-items-center justify-content-center text-white">
                            <i class="bi bi-envelope-at fs-5"></i>
                        </div>
                        <div class="d-flex flex-column">
                            <span class="text-label-custom text-lowercase">email address</span>
                            <span style="color: black;">Leng@gmail.com</span>
                        </div>
                    </div>

                    <!-- Location Item -->
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-circle-custom rounded-circle d-flex align-items-center justify-content-center text-white">
                            <i class="bi bi-geo-alt-fill fs-5"></i>
                        </div>
                        <div class="d-flex flex-column">
                            <span class="text-label-custom text-lowercase">location</span>
                            <span style="color: black;">RR-22, 3rd Floor, prey sor, PHNOM PENH,...</span>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
